name = "holonet-feed"
main = "src/index.js"
compatibility_date = "2026-08-14"

# HOLODEX_API_KEY는 여기 적지 말 것. 아래 명령으로 등록한다:
#   wrangler secret put HOLODEX_API_KEY

# 곡 아카이브를 영구 누적 저장하는 KV. 아래 명령으로 만든 뒤
# 출력된 id를 여기에 채워 넣는다:
#   npx wrangler kv namespace create MUSIC_ARCHIVE
[[kv_namespaces]]
binding = "MUSIC_ARCHIVE"
id = "1e67b23ef1a7438db4fb00b973149133"

[observability]
enabled = true
