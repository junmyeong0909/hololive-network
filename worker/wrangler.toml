name = "holonet-feed"
main = "src/index.js"
compatibility_date = "2026-08-14"

# HOLODEX_API_KEY는 여기 적지 말 것. 아래 명령으로 등록한다:
#   wrangler secret put HOLODEX_API_KEY

# 곡 아카이브를 영구 누적 저장하는 KV. 아래 명령으로 만든 뒤
# 출력된 id를 여기에 채워 넣는다:
#   npx wrangler kv namespace create MUSIC_ARCHIVE
[[kv_namespaces]]
binding = "MUSIC_ARCHIVE"
id = "1e67b23ef1a7438db4fb00b973149133"

# 합방/곡 아카이브 갱신 안전망.
# JST 08~22시에 2시간 간격 (Cron은 UTC 기준이라 JST-9h로 환산).
#   UTC 23,01,03,05,07,09,11,13 = JST 08,10,12,14,16,18,20,22
# 새 합방 예보가 거의 없는 JST 심야(00~08시)에는 돌지 않는다.
[triggers]
crons = ["0 23,1,3,5,7,9,11,13 * * *"]

[observability]
enabled = true
